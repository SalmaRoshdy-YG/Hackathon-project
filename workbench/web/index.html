<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precedent · Experiment workspace</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true">P</span><strong>Precedent</strong></div>
  <nav aria-label="Experiment stages">
    <ol class="workflow">
      <li><button data-stage="past" aria-current="step" aria-pressed="true"><span aria-hidden="true">1</span>Past experiments</button></li>
      <li><button data-stage="ask" aria-pressed="false"><span aria-hidden="true">2</span>Ask the agent</button></li>
      <li><button data-stage="decide" aria-pressed="false"><span aria-hidden="true">3</span>You decide</button></li>
      <li><button data-stage="result" aria-pressed="false"><span aria-hidden="true">4</span>Result</button></li>
    </ol>
  </nav>
  <div class="connection"><span class="dot" id="atlas-dot" aria-hidden="true"></span><span>MongoDB Atlas <small id="connection">Connecting</small></span></div>
</header>
<main>
  <header class="heading">
    <div>
      <p class="eyebrow" id="project" hidden></p>
      <h1>Experiment workspace</h1>
      <p id="prompt" class="muted"></p>
    </div>
    <div class="secondary-links" aria-label="More experiment tools">
      <button id="open-research" class="text-button" aria-haspopup="dialog">Research library</button>
      <button id="open-runs" class="text-button" aria-haspopup="dialog">Run comparison</button>
    </div>
  </header>
  <p id="error" class="error" role="alert" hidden></p>
  <section class="mongo" aria-label="In MongoDB">
    <span class="eyebrow">In MongoDB</span>
    <div id="stage-activity" role="status"></div>
  </section>
  <div class="workspace">
    <section class="agent" aria-labelledby="agent-title">
      <div class="terminal-top">
        <div class="terminal-heading">
          <span class="terminal-dots" aria-hidden="true">● ● ●</span>
          <h2 id="agent-title">Codex terminal</h2>
          <span id="terminal-status" role="status"></span>
        </div>
        <button id="terminal-toggle" class="terminal-button" disabled>Open terminal</button>
      </div>
      <div class="terminal-body">
        <p id="terminal-placeholder">Connecting to the workspace…</p>
        <div id="terminal" aria-label="Agent terminal" hidden></div>
      </div>
      <div class="terminal-actions" id="terminal-actions" hidden>
        <span>Press Enter in Codex to send the prompt.</span>
        <button id="send-prompt" class="terminal-button">Insert suggested prompt</button>
      </div>
    </section>
    <section class="experiments" aria-labelledby="experiments-title">
      <div class="section-head"><h2 id="experiments-title" tabindex="-1">Past experiments</h2><span id="finding-count" class="eyebrow"></span></div>
      <div id="findings" class="stack"><p class="empty">Loading experiments…</p></div>
    </section>
    <section class="panel plan" id="decision-panel" aria-labelledby="plan-title" hidden>
      <div class="section-head"><h2 id="plan-title" tabindex="-1">Experiment plan</h2><span id="plan-status" class="tag" role="status"></span></div>
      <div id="decision" class="decision-body"></div>
      <div id="plan-actions" class="actions" hidden>
        <button id="run-plan" class="primary">Run plan</button>
        <button id="reject-plan" class="secondary">Reject</button>
      </div>
    </section>
    <section class="panel result" id="result" aria-labelledby="result-title" hidden>
      <div class="section-head"><h2 id="result-title" tabindex="-1">Result</h2><span id="target" class="tag"></span></div>
      <div id="result-comparison" class="comparison"></div>
    </section>
  </div>
</main>
<section class="activity" aria-label="Live Atlas activity">
  <div class="section-head"><h2 class="eyebrow">Atlas activity</h2><span id="stream-status">Connecting</span></div>
  <div id="event-lines" class="activity-lines"><p>Waiting for Atlas events…</p></div>
</section>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <div class="drawer-inner">
    <header class="drawer-header">
      <h2 id="drawer-title"></h2>
      <button id="close-drawer" class="secondary" autofocus>Close</button>
    </header>
    <div id="inspector"></div>
    <section id="library" hidden>
      <form id="search" class="search">
        <input id="query" aria-label="Search experiments" placeholder="Ask about a method or result" required maxlength="1500">
        <button class="primary">Search Atlas</button>
      </form>
      <label class="check"><input type="checkbox" id="match"> Compare with the active task conditions</label>
      <p id="search-error" class="error" role="alert" hidden></p>
      <div id="search-results" class="stack"></div>
    </section>
  </div>
</dialog>
</body>
</html>
