<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Clickable demo mockup. One screen, centred on Claude Code and the decision it makes. Task: fine-tune ResNet-18 on CIFAR-10 in a 2 GPU-minute budget.
     All numbers are illustrative until the benchmark owner replaces them with measured runs from our GPU PC (see PLATFORM.md, Benchmark). -->
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Precedent Research Memory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --side:#0D3A2C; --side-2:#134A39; --side-ink:#E4F1EA; --side-muted:#9CC0AF;
  --bg:#F5F7F3; --surface:#FFFFFF; --sunk:#EDF1EB; --line:#DAE1D8; --ink:#13201A; --muted:#5A6961;
  --green:#147D52; --green-2:#0E6342; --green-soft:#E0F1E7; --mint:#5FD39A;
  --b:#3B4CB0; --b-soft:#E4E7F7;
  --pos:#167A40; --pos-soft:#DDF0E3; --neg:#B04E1B; --neg-soft:#F7E4D8; --bad:#B12236; --bad-soft:#F6DEE2; --off:#66736C; --off-soft:#EAEDE9;
  --code-bg:#0F241C; --code-fg:#D3E6DC; --code-k:#7FD8AC; --code-s:#EBC28C; --code-n:#AEB9F4; --code-c:#7D9389;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 6px 18px rgba(19,32,26,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}

/* ---- top bar: brand, four stages, Atlas status ---- */
.top{background:var(--side);color:var(--side-ink);display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:700 19px/1 var(--f-display)}
.brand small{display:block;font-size:11px;color:var(--side-muted);margin-top:2px}
.steps{display:flex;gap:6px;flex:1;min-width:280px;justify-content:center;flex-wrap:wrap}
.steps li{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-size:13px;color:var(--side-muted)}
.steps ol{display:contents}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-mono);background:var(--side-2)}
.steps li.done{color:var(--side-ink)} .steps li.done .n{background:var(--mint);color:var(--side)}
.steps li.now{background:var(--side-2);color:#fff;font-weight:600} .steps li.now .n{background:#fff;color:var(--side)}
@media (max-width:760px){.steps li span.l{display:none}.steps li.now span.l{display:inline}}
.pill{display:flex;align-items:center;gap:8px;background:var(--side-2);border-radius:10px;padding:7px 11px;font-size:12.5px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(95,211,154,.25)}
.mock{font:500 10.5px var(--f-mono);color:var(--side-muted)}

/* ---- main stage ---- */
.stage{max-width:1240px;margin:0 auto;padding:22px max(20px,env(safe-area-inset-left,0px)) 130px;display:flex;flex-direction:column;gap:16px}
.task{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.task h1{font:700 clamp(21px,2.4vw,28px)/1.2 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.task .sub{color:var(--muted);font-size:14px;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--green);background:var(--green);color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--green-2)} .btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--green)}
.mongo{display:flex;gap:12px;align-items:flex-start;background:#EEF8F2;border:1px solid #BFE3CF;border-radius:12px;padding:11px 14px}
.mongo .leaf{width:28px;height:28px;border-radius:8px;background:var(--side);display:grid;place-items:center;flex:none}
.mongo .t{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:2px}
.mongo p{font-size:14px}

.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px;font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---- terminal (the centrepiece) ---- */
.term{background:var(--code-bg);color:var(--code-fg);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.term .bar-t{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#0A1A14;font:500 11.5px var(--f-mono);color:var(--code-c)}
.term .bar-t i{width:10px;height:10px;border-radius:50%;background:#2E4A3E}
.term .bar-t span{margin-left:6px}
.term .body{padding:14px 16px;font:13px/1.7 var(--f-mono);height:440px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.term .you{color:#9EE6C2}.term .you::before{content:"> ";color:var(--mint)}
.term .cl::before{content:"⏺ ";color:#E8C08A}
.term .tool{color:var(--code-c)}.term .tool::before{content:"  ⎿ "}
.term .good{color:#7FD8AC}.term .badv{color:#F2A27C}.term .dim{color:var(--code-c)}
.term .inrow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #1E3A2F;align-items:center}
.term .inrow b{color:var(--mint);font:600 13px var(--f-mono)}
.term .inrow input{flex:1;min-width:0;background:transparent;border:0;color:#E4F1EA;font:13px var(--f-mono);outline:none}
.term .inrow button{border:1px solid var(--mint);background:transparent;color:var(--mint);border-radius:7px;padding:6px 12px;font:600 12.5px var(--f-body);cursor:pointer}
.term .inrow button:hover:not([disabled]){background:rgba(95,211,154,.14)}
.term .inrow button.no{border-color:#F2A27C;color:#F2A27C}
.term .inrow button[disabled]{opacity:.4;cursor:not-allowed}

/* ---- experiments the agent reads ---- */
.xlist{display:flex;flex-direction:column;gap:8px}
.xrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:border-color .3s,background .3s,box-shadow .3s,opacity .3s}
.xrow:hover{border-color:var(--muted)}
.xrow .t{flex:1;min-width:0;font-weight:600;font-size:13.5px;line-height:1.35}
.xrow .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.xrow.use{border-color:var(--green);background:#F2FAF5;box-shadow:0 0 0 2px var(--green-soft)}
.xrow.avoid{border-color:#E8B79B;background:#FDF6F2}
.xrow.nofit{opacity:.62}
.xrow.new{border-color:var(--b);box-shadow:0 0 0 2px var(--b-soft)}
.chip{font:600 11.5px/1 var(--f-body);padding:5px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.c-pos{background:var(--pos-soft);color:var(--pos)} .c-neg{background:var(--neg-soft);color:var(--neg)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-off{background:var(--off-soft);color:var(--off)} .c-b{background:var(--b-soft);color:var(--b)} .c-g{background:var(--green-soft);color:var(--green)}

/* ---- result ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.crow{display:grid;grid-template-columns:200px minmax(0,1fr) 64px;gap:14px;align-items:center;margin-top:14px}
.crow .lbl{font-weight:600;font-size:14px} .crow .lbl small{display:block;font:400 12px var(--f-mono);color:var(--muted)}
.crow .v{font:700 20px var(--f-display);text-align:right}
@media (max-width:620px){.crow{grid-template-columns:minmax(0,1fr) 60px}.crow .bar{grid-column:1/-1;order:3}}
.bar{position:relative;height:18px;border-radius:9px;background:var(--sunk)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--fill,var(--pos));transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar s{position:absolute;top:-4px;bottom:-4px;left:90%;width:2px;background:var(--ink)}
.legend{position:relative;height:16px;font:400 11px var(--f-mono);color:var(--muted);margin-top:4px}
.legend span{position:absolute;left:90%;transform:translateX(-50%);color:var(--ink)}

/* ---- Atlas strip + detail drawer ---- */
.strip{position:fixed;left:0;right:0;bottom:0;background:var(--code-bg);color:var(--code-fg);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.strip .in{max-width:1240px;margin:0 auto}
.strip .hd{display:flex;gap:8px;align-items:center;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--code-k)}
.strip .hd i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:blink 1.6s ease-in-out infinite}
.strip .hd em{margin-left:auto;font-style:normal;color:var(--code-c);text-transform:none;letter-spacing:0;font-weight:400}
@keyframes blink{50%{opacity:.35}}
.lines{max-height:68px;overflow:auto;margin-top:3px}
.line{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;font:12px/1.6 var(--f-mono);border:0;background:transparent;color:inherit;text-align:left;padding:1px 4px;border-radius:5px;cursor:pointer;width:100%}
.line:hover{background:rgba(255,255,255,.07)}
.line .tm{color:var(--code-c)} .line .ms{color:var(--code-n)}
.line .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .line .d b{color:var(--code-k);font-weight:500} .line .d b.c{color:var(--code-s)}
.line.fresh{animation:flash 1.2s ease-out}
@keyframes flash{from{background:rgba(127,216,172,.25)}to{background:transparent}}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(19,32,26,.14);padding:22px 20px 90px;overflow:auto;z-index:8;transform:translateX(102%);transition:transform .25s}
.drawer.open{transform:none}
.drawer h2{font:700 18px/1.25 var(--f-display);margin:6px 0 10px}
.drawer .x{position:absolute;top:12px;right:12px;border:0;background:var(--sunk);border-radius:8px;width:30px;height:30px;cursor:pointer}
.isec{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.isec h4{margin:0;font:500 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font:12.5px var(--f-mono);overflow-wrap:anywhere}
pre.code{background:var(--code-bg);color:var(--code-fg);font:12px/1.55 var(--f-mono);padding:10px 12px;border-radius:10px;overflow-x:auto;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#134A39"/><circle cx="10" cy="10" r="3.2" fill="#E5A25A"/><circle cx="21" cy="15" r="3.2" fill="#9EA1F5"/><circle cx="10" cy="20" r="3.2" fill="#5FD39A"/></svg>
    <div><b>Precedent</b><small>research memory for agents</small></div>
  </div>
  <nav class="steps" aria-label="Demo stages"><ol id="steps"></ol></nav>
  <div><div class="pill"><i></i>MongoDB Atlas · connected</div><div class="mock" style="margin-top:4px;text-align:right">Mockup · numbers are illustrative</div></div>
</header>

<main class="stage" id="stage"></main>

<section class="strip" aria-label="Atlas activity"><div class="in">
  <div class="hd"><i></i>Atlas activity<em>real commands as they run · click a line</em></div>
  <div class="lines" id="lines"></div>
</div></section>
<aside class="drawer" id="drawer" aria-label="Details" aria-live="polite"></aside>

<script>
/* ---------- the task and the data (mockup). The same shapes are what the platform stores. ---------- */
const TARGET = 0.90;
const TASK = {dataset:'CIFAR-10 (10 classes)', model:'ResNet-18', image:'32 px', budget:'2 GPU-minutes, one run'};
const BASELINE = {label:'Claude Code on its own', sub:'trains from scratch · lr 0.1 · 3 epochs', acc:.712, secs:68};
const WARM = {label:'Claude Code with Precedent', sub:'fine-tunes stored weights · lr 0.01 · 3 epochs', acc:.931, secs:64};
const SEED = [
  {key:'ckpt', id:'7f3a9c12', agent:'vision-agent-1', title:'ResNet-18 fine-tuned from ImageNet weights reached 93.4% on CIFAR-10',
   dataset:TASK.dataset, model:'ResNet-18', image:'32 px', settings:'start from ResNet18_Weights.IMAGENET1K_V1 · SGD lr 0.01 · 3 epochs · batch 128',
   acc:.934, secs:'≈ 70 s', dir:'positive', exec:'completed',
   cmd:'python -m benchmark.run --job finetune-lr0.01 --dataset cifar10',
   weights:{file:'resnet18_cifar10_ft.pt', size:'43 MB', src:'trained by vision-agent-1, stored in GridFS'}},
  {key:'fastlr', id:'b21e07d4', agent:'vision-agent-2', title:'Training from scratch with learning rate 0.4 diverged',
   dataset:TASK.dataset, model:'ResNet-18', image:'32 px', settings:'random init · SGD lr 0.4 · no warmup · 3 epochs',
   acc:.100, secs:'≈ 65 s', dir:'negative', exec:'completed', cmd:'python -m benchmark.run --job scratch-lr0.4 --dataset cifar10'},
  {key:'fmnist', id:'c94f5a61', agent:'robotics-agent', title:'ResNet-18 reached 94.8% on Fashion-MNIST',
   dataset:'Fashion-MNIST (grayscale)', model:'ResNet-18', image:'28 px', settings:'random init · lr 0.05 · 5 epochs',
   acc:.948, secs:'≈ 60 s', dir:'positive', exec:'completed', cmd:'python -m benchmark.run --job scratch-lr0.05 --dataset fashion-mnist'},
  {key:'crash', id:'e05d8b33', agent:'eval-agent', title:'Batch-4096 run crashed',
   dataset:TASK.dataset, model:'ResNet-18', image:'32 px', settings:'batch 4096 on one GPU',
   acc:null, secs:'—', dir:'undetermined', exec:'crashed', error:'Out of GPU memory in the first step. Nothing was measured, so this is not evidence against anything.'},
  {key:'paper', id:'a8d14e70', agent:'ResNet paper (imported)', title:'Shortcut connections let deeper networks train better',
   dataset:'ImageNet (1,000 classes)', model:'ResNet / plain CNN', image:'224 px', settings:'He et al., 2015 · 34-layer plain 28.54% vs residual 25.03% error',
   acc:null, secs:'—', dir:'positive', exec:'completed', background:true},
];
const STAGES = ['Past experiments','Ask Claude Code','You decide','Result'];
const PROMPT = 'Build on what past agents learned about training ResNet-18 on CIFAR-10. Target 90%, one run, 2 GPU-minutes. Which experiments would you use?';
const CALLOUT = [
  'Each experiment is one document. The weights files sit in GridFS, and new experiments stream in through a change stream.',
  'search_experiments is one Atlas aggregate: $vectorSearch inside this project, a $lookup that keeps only the live version, and the fit labels computed in the database.',
  'Claude Code’s plan is stored as pending. Your confirmation is one atomic update, so it can run exactly once.',
  'Cited versions are re-checked, the weights stream from GridFS, and the new experiment is inserted and pushed to this screen by a change stream.',
];

/* ---------- state ---------- */
let clock = new Date(Date.UTC(2026,10,14,18,38,0));
const tick = s => { clock = new Date(clock.getTime()+s*1000); return clock.toISOString().slice(11,19); };
const S = {stage:0, marks:{}, ex:SEED.map(f=>({...f,version:1})), events:[], term:[], busy:false, planned:false, result:null, fresh:null, sel:null, ev:null};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => (Math.round(x*1000)/10)+'%';
const wait = ms => new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?0:ms));
const $ = id => document.getElementById(id);

function log(op,coll,detail,o={}){ S.events.push({t:tick(o.dt??.4),op,coll,detail,ms:o.ms??null,shape:o.shape||null,change:!!o.change,fresh:true}); renderStrip(); }
const chg = (coll,detail) => log('change stream',coll,detail,{change:true,dt:.1});
function renderStrip(){
  const ev=S.events.slice(-30), off=S.events.length-ev.length;
  $('lines').innerHTML = ev.map((e,i)=>`<button class="line${e.fresh?' fresh':''}" data-ev="${off+i}"><span class="tm">${e.t}</span><span class="d"><b class="${e.change?'c':''}">${esc(e.op)}</b> ${esc(e.coll)} · ${esc(e.detail)}</span><span class="ms">${e.ms!=null?e.ms+' ms':''}</span></button>`).join('')
    || '<div class="muted" style="font:12px var(--f-mono);padding:2px 4px">waiting for the first command…</div>';
  S.events.forEach(e=>e.fresh=false); $('lines').scrollTop=1e6;
}

/* ---------- terminal ---------- */
const say = (cls,text) => { S.term.push({cls,text}); renderTerm(); };
const termHTML = () => S.term.map(l=>`<div class="${l.cls}">${l.text}</div>`).join('') || '<div class="dim">Claude Code is connected to Precedent through MCP (6 tools). Ask it something.</div>';
function renderTerm(){ const b=$('tbody'); if(!b) return; b.innerHTML=termHTML(); b.scrollTop=1e6; }
async function lines(list,ms=420){ for(const [c,t] of list){ say(c,t); await wait(ms); } }

/* ---------- what the MCP tools do ---------- */
async function askClaude(){
  S.busy=true; render();
  say('you', esc(PROMPT)); await wait(500);
  await lines([['cl','I’ll search the shared memory for this task first.'],['tool','search_experiments("ResNet-18 on CIFAR-10, 90% target, 2 GPU-minutes", conditions: CIFAR-10 · ResNet-18 · 32 px)']]);
  log('aggregate','result_vectors','$vectorSearch (project filter) + $lookup + fit labels · 4 docs',{ms:38,shape:'aggregate result_vectors\n  $vectorSearch { filter: { project_id: "vision-research" }, queryVector: [1536 floats] }\n  $lookup results { live version, not expired, completed }\n  $set applicability { cohort, dataset, input size }'});
  S.marks={ckpt:'use',fastlr:'avoid',fmnist:'nofit',paper:'nofit',crash:'hidden'}; render();
  await lines([
    ['tool','4 candidates · the crashed run was not returned'],
    ['cl','Here’s how I read them:'],
    ['good','  USE    7f3a9c12 v1 · fine-tuning from ImageNet weights reached 93.4% on this exact task'],
    ['badv','  AVOID  b21e07d4 v1 · from scratch at lr 0.4 diverged on this same task'],
    ['dim','  SKIP   c94f5a61 · Fashion-MNIST, 28 px grayscale: doesn’t fit (dataset, input size)'],
    ['dim','  SKIP   a8d14e70 · the ResNet paper’s ImageNet result: background only'],
    ['cl','Plan: fine-tune the stored ResNet-18 weights at lr 0.01 for 3 epochs, which should fit the 2-minute budget.'],
    ['tool','propose_plan(job: "finetune-lr0.01", used: [7f3a9c12 v1], avoided: [b21e07d4 v1], set_aside: [c94f5a61, a8d14e70])'],
  ]);
  log('insert','decisions','plan stored · status pending',{ms:6}); chg('decisions','insert · pending');
  S.stage=2; S.planned=true; S.busy=false; render();
}
async function decide(yes){
  S.busy=true; render();
  if(!yes){
    say('you','Not now.'); await wait(350);
    log('update','decisions','pending → rejected (conditional update)',{ms:5}); chg('decisions','update · rejected');
    say('cl','Understood. Nothing was run and no GPU time was used. Tell me what to change, or ask me to try again.');
    S.planned=false; S.busy=false; S.stage=1; S.marks={}; render(); return;
  }
  say('you','Run it.'); await wait(350);
  log('update','decisions','pending → approved, exactly once (findOneAndUpdate)',{ms:6}); chg('decisions','update · approved');
  S.stage=3; render();
  await lines([['cl','Running the approved plan.'],
    ['tool','run_plan(decision) · cited versions re-checked: all current'],
    ['tool','load_weights(7f3a9c12 v1) · resnet18_cifar10_ft.pt · 43 MB from GridFS']],500);
  log('find','results','re-check cited versions · all live',{ms:4});
  log('find','fs.chunks','stream resnet18_cifar10_ft.pt',{ms:210});
  for(const e of ['epoch 1/3 · loss 0.61 · val 88.7%','epoch 2/3 · loss 0.33 · val 92.2%','epoch 3/3 · loss 0.21 · val 93.1%']){ say('dim',e); await wait(650); }
  say('good','Done in 64 s · test accuracy 93.1% (target 90%)');
  await lines([['tool','publish_result(decision, accuracy 93.1%, weights resnet18_cifar10_ft_v2.pt)']],450);
  log('insert','results','new experiment · cites 7f3a9c12 v1',{ms:12}); chg('results','insert · new experiment');
  S.ex.push({key:'new',id:'d2c6f801',agent:'claude-code (you)',title:'ResNet-18 fine-tuned again reached 93.1% in 64 s',dataset:TASK.dataset,model:'ResNet-18',image:'32 px',
    settings:'start from 7f3a9c12 v1 weights · SGD lr 0.01 · 3 epochs · batch 128',acc:.931,secs:'64 s',dir:'positive',exec:'completed',version:1,
    cmd:'python -m benchmark.run --job finetune-lr0.01 --dataset cifar10',weights:{file:'resnet18_cifar10_ft_v2.pt',size:'43 MB',src:'trained just now, stored in GridFS'}});
  S.fresh='new'; S.result=true; S.busy=false; render();
  say('cl','Saved as a new experiment. The next agent can build on it.');
}
function reset(){ S.stage=0;S.marks={};S.term=[];S.planned=false;S.result=null;S.fresh=null;S.ex=SEED.map(f=>({...f,version:1}));S.events=[];render();renderStrip(); }

/* ---------- views ---------- */
const labelOf = f => f.exec==='crashed' ? ['c-bad','Crashed · no result'] : f.background ? ['c-off','Imported paper'] : f.dir==='positive' ? ['c-pos','Worked'] : ['c-neg','Failed'];
function xrow(f){
  const m = S.marks[f.key]||'', [c,l] = labelOf(f);
  const tag = m==='use'?['c-g','Using']:m==='avoid'?['c-neg','Avoiding']:m==='nofit'?['c-off','Doesn’t fit']:m==='hidden'?['c-bad','Never offered']:null;
  const cls = m==='hidden'?'nofit':m, extra = f.key===S.fresh?' new':'';
  return `<button class="xrow ${cls}${extra}" data-x="${f.key}"><span class="chip ${c}">${l}</span><span class="t">${esc(f.title)}<small>${esc(f.agent)} · ${esc(f.dataset)} · ${f.acc!=null?pct(f.acc):'no measurement'}</small></span>${tag?`<span class="chip ${tag[0]}">${tag[1]}</span>`:''}${f.weights?'<span class="chip c-b">weights</span>':''}</button>`;
}
function termBox(){
  let inp;
  if(S.stage===0) inp=`<button type="button" id="go" ${S.busy?'disabled':''}>Ask Claude Code</button>`;
  else if(S.stage===1) inp=`<button type="submit" ${S.busy?'disabled':''}>Send</button>`;
  else if(S.stage===2) inp=`<button type="button" id="yes" ${S.busy?'disabled':''}>Run it</button><button type="button" class="no" id="no" ${S.busy?'disabled':''}>Not now</button>`;
  else inp='';
  const placeholder = S.stage<=1 ? PROMPT : S.stage===2 ? 'Claude Code is asking: run this plan?' : '';
  return `<div class="term" role="region" aria-label="Embedded terminal"><div class="bar-t"><i></i><i></i><i></i><span>claude · ~/vision-research · MCP: precedent</span></div>
    <div class="body" id="tbody">${termHTML()}</div>
    <form class="inrow" id="tform" ${S.stage>=3?'hidden':''}><b>›</b><input value="${S.stage<=1&&!S.busy?esc(placeholder):''}" placeholder="${esc(placeholder)}" aria-label="Message to Claude Code" ${S.busy||S.stage>=2?'disabled':''}>${inp}</form></div>`;
}
function resultCard(){
  const row=(r,fill)=>`<div class="crow"><div class="lbl">${r.label}<small>${r.sub}</small></div><div class="bar"><i style="width:${r.acc*100}%;--fill:${fill}"></i><s></s></div><div class="v">${pct(r.acc)}</div></div>`;
  return `<section class="card"><div class="panel-h">Same request, same budget, different decision</div>
    ${row(BASELINE,'var(--off)')}${row(WARM,'var(--pos)')}
    <div class="legend"><span>target 90%</span></div>
    <p style="margin-top:12px;font-size:14.5px">With the memory, Claude Code skipped the dead end and started from stored weights: <b>${pct(WARM.acc)}</b> in ${WARM.secs} s, against <b>${pct(BASELINE.acc)}</b> when it started from nothing.</p>
    <p class="muted" style="margin-top:6px;font-size:13px">Next phase: correct or expire a finding and ask again, and watch the plan change. <button class="btn ghost" id="again" style="margin-left:8px;padding:5px 11px">Replay the demo</button></p></section>`;
}
function render(){
  $('steps').innerHTML = STAGES.map((s,i)=>`<li class="${i<S.stage?'done':i===S.stage?'now':''}" ${i===S.stage?'aria-current="step"':''}><span class="n">${i<S.stage?'✓':i+1}</span><span class="l">${s}</span></li>`).join('');
  const heading = ['What have other agents already tried?','Ask Claude Code to build on it','You decide what runs','The memory changed the decision'][S.stage];
  const act = S.stage===0 ? `<button class="btn" id="next">Ask Claude Code →</button>` : '';
  const keepTerm = $('tbody') && $('tform');
  const sideH = S.stage===0 ? 'Past experiments' : 'Experiments Claude Code is reading';
  $('stage').innerHTML = `
    <div class="task"><div><h1>${heading}</h1><p class="sub">Task: fine-tune <b>${TASK.model}</b> on <b>${TASK.dataset}</b> to 90% · ${TASK.budget}</p></div>${act}</div>
    <div class="mongo"><span class="leaf"><svg width="16" height="16" viewBox="0 0 16 16" fill="#5FD39A"><path d="M8 1c2.5 3 4 5 4 7.5A4 4 0 0 1 8.5 13V15h-1V13A4 4 0 0 1 4 8.5C4 6 5.500 4 8 1z"/></svg></span><div><span class="t">In MongoDB</span><p>${CALLOUT[S.stage]}</p></div></div>
    <div class="split"><div>${termBox()}</div><div><div class="panel-h"><span>${sideH}</span><span>${S.ex.length} in memory</span></div><div class="xlist">${S.ex.map(xrow).join('')}</div></div></div>
    ${S.result?resultCard():''}`;
  renderTerm(); renderDrawer();
  const n=$('next'); if(n) n.onclick=()=>{S.stage=1;render();};
  const g=$('go'); if(g) g.onclick=()=>{S.stage=1;askClaude();};
  const f=$('tform'); if(f) f.onsubmit=e=>{e.preventDefault(); if(!S.busy) askClaude();};
  const y=$('yes'); if(y) y.onclick=()=>decide(true);
  const no=$('no'); if(no) no.onclick=()=>decide(false);
  const a=$('again'); if(a) a.onclick=reset;
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.x;S.ev=null;renderDrawer();});
}

/* ---------- details drawer: opens only on click ---------- */
function renderDrawer(){
  const d=$('drawer'); let h='';
  if(S.sel){
    const f=S.ex.find(x=>x.key===S.sel), [c,l]=labelOf(f);
    h=`<button class="x" id="close" aria-label="Close">×</button><span class="chip ${c}">${l}</span><h2>${esc(f.title)}</h2>
    <div class="isec"><h4>Conditions</h4><dl class="kv"><dt>dataset</dt><dd>${esc(f.dataset)}</dd><dt>model</dt><dd>${esc(f.model)}</dd><dt>input size</dt><dd>${f.image}</dd></dl></div>
    <div class="isec"><h4>What was tried</h4><p style="font-size:13.5px">${esc(f.settings)}</p></div>
    <div class="isec"><h4>Outcome</h4>${f.error?`<p style="font-size:13.5px">${esc(f.error)}</p>`:`<dl class="kv"><dt>test accuracy</dt><dd>${f.acc!=null?pct(f.acc):'—'}</dd><dt>GPU time</dt><dd>${f.secs}</dd><dt>execution</dt><dd>${f.exec}</dd><dt>direction</dt><dd>${f.dir}</dd></dl>`}</div>
    ${f.cmd?`<div class="isec"><h4>Rerun it</h4><pre class="code">${esc(f.cmd)}</pre></div>`:''}
    ${f.weights?`<div class="isec"><h4>Stored weights</h4><dl class="kv"><dt>file</dt><dd>${f.weights.file}</dd><dt>size</dt><dd>${f.weights.size}</dd><dt>source</dt><dd>${esc(f.weights.src)}</dd></dl></div>`:''}
    <div class="isec"><h4>Record</h4><dl class="kv"><dt>id</dt><dd>${f.id} · v${f.version}</dd><dt>source agent</dt><dd>${esc(f.agent)}</dd><dt>status</dt><dd>current</dd></dl></div>`;
  } else if(S.ev!=null){
    const e=S.events[S.ev];
    h=`<button class="x" id="close" aria-label="Close">×</button><span class="chip c-g">${e.change?'Change stream':'MongoDB command'}</span><h2>${esc(e.op)} ${esc(e.coll)}</h2>
    <div class="isec"><h4>What happened</h4><p style="font-size:13.5px">${esc(e.detail)}</p></div>${e.shape?`<div class="isec"><h4>Redacted command</h4><pre class="code">${esc(e.shape)}</pre></div>`:''}`;
  }
  d.innerHTML=h; d.classList.toggle('open',!!h);
  const x=$('close'); if(x) x.onclick=()=>{S.sel=null;S.ev=null;renderDrawer();};
}
$('lines').addEventListener('click',e=>{const b=e.target.closest('[data-ev]'); if(b){S.ev=+b.dataset.ev;S.sel=null;renderDrawer();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){S.sel=null;S.ev=null;renderDrawer();}});

/* seed events: the experiments arriving in memory before the demo starts */
['vision-agent-1','vision-agent-2','robotics-agent','eval-agent','ResNet paper (imported)'].forEach(a=>log('insert','results',`experiment from ${a}`,{ms:11,dt:.6}));
chg('results','insert · 5 experiments live');
render();
</script>
</html>
