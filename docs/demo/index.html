<!doctype html>
<html lang="en">

<title>Precedent Research Memory</title>

<style>
/* Layout: dark green sidebar | light workspace (stage + Atlas activity strip) | evidence inspector. One light look by design. */
:root{
  color-scheme:light;
  --side:#0D3A2C; --side-2:#134A39; --side-ink:#E4F1EA; --side-muted:#9CC0AF; --side-line:#1F5845;
  --bg:#F5F7F3; --surface:#FFFFFF; --sunk:#EDF1EB; --line:#DAE1D8; --ink:#13201A; --muted:#5A6961;
  --green:#147D52; --green-2:#0E6342; --green-soft:#E0F1E7; --mint:#5FD39A;
  --a:#94560C; --a-soft:#F3E6D2; --b:#3B4CB0; --b-soft:#E4E7F7;
  --pos:#167A40; --pos-soft:#DDF0E3; --neg:#B04E1B; --neg-soft:#F7E4D8; --bad:#B12236; --bad-soft:#F6DEE2; --off:#66736C; --off-soft:#EAEDE9;
  --code-bg:#0F241C; --code-fg:#D3E6DC; --code-k:#7FD8AC; --code-s:#EBC28C; --code-n:#AEB9F4; --code-c:#7D9389;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 6px 18px rgba(19,32,26,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;min-height:100%}
@media (max-width:1180px){.app{grid-template-columns:200px minmax(0,1fr)}.insp{grid-column:2}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.insp{grid-column:1}}

.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;padding:20px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh}
@media (max-width:760px){.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand b{font:700 20px/1 var(--f-display)}
.brand small{display:block;font-size:11.5px;color:var(--side-muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){.nav{flex-direction:row;flex-wrap:wrap}}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--side-muted);text-align:left;padding:10px;border-radius:9px;cursor:pointer;font-weight:500}
.nav button svg{width:17px;height:17px;flex:none}
.nav button:hover{color:var(--side-ink);background:var(--side-2)}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--mint)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--side-muted)}
@media (max-width:760px){.side-foot{margin:0 0 0 auto}}
.atlas-pill{display:flex;align-items:center;gap:9px;background:var(--side-2);border:1px solid var(--side-line);border-radius:10px;padding:9px 10px;color:var(--side-ink)}
.atlas-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(95,211,154,.25);flex:none}
.atlas-pill small{display:block;color:var(--side-muted);font-size:11px}
.mockflag{font:500 10.5px/1.4 var(--f-mono);padding:0 4px}
@media (max-width:760px){.mockflag{display:none}}

.work{display:flex;flex-direction:column;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
@media (min-width:761px){.work{padding-left:32px;padding-right:28px}}
@media (max-width:760px){.work{padding-right:max(16px,env(safe-area-inset-right,0px))}}
.page{flex:1;padding-block:26px 18px;display:flex;flex-direction:column;gap:18px;min-width:0;max-width:980px}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(24px,2.8vw,32px)/1.15 var(--f-display);letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
h2{font:700 18px/1.25 var(--f-display);margin:0}
h3{font:600 15px/1.3 var(--f-display);margin:0}
p{margin:0}
.lede{font-size:16.5px;color:var(--muted);max-width:62ch}

.stepper{display:flex;gap:4px;overflow-x:auto}
.stepper button{flex:1;min-width:44px;border:0;background:transparent;padding:6px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stepper .dotn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--sunk);color:var(--muted)}
.stepper button.done .dotn{background:var(--green-soft);color:var(--green)}
.stepper button[aria-current="step"] .dotn{background:var(--green);color:#fff}
.stepper button[aria-current="step"]{color:var(--ink);font-weight:600}
.stepper .lbl{text-align:center;line-height:1.2}
@media (max-width:860px){.stepper .lbl{display:none}}
.stagebar{display:flex;gap:10px;align-items:center;justify-content:flex-end}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--green);background:var(--green);color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:var(--surface);color:var(--green)}
.btn.ghost:hover{background:var(--green-soft)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;color:var(--green);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}

.mongo{display:flex;gap:12px;align-items:flex-start;background:#EEF8F2;border:1px solid #BFE3CF;border-radius:12px;padding:12px 14px}
.mongo .leaf{width:30px;height:30px;border-radius:8px;background:var(--side);display:grid;place-items:center;flex:none}
.mongo .leaf svg{width:16px;height:16px}
.mongo .t{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:2px}
.mongo p{font-size:14.5px}

.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s}
.fcard:hover{border-color:var(--muted)}
.fcard .t{font-weight:600;font-size:14px;line-height:1.3}
.fcard .s{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font:600 11.5px/1 var(--f-body);padding:5px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.c-pos{background:var(--pos-soft);color:var(--pos)} .c-neg{background:var(--neg-soft);color:var(--neg)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-off{background:var(--off-soft);color:var(--off)} .c-b{background:var(--b-soft);color:var(--b)} .c-g{background:var(--green-soft);color:var(--green)}
.c-line{background:transparent;color:var(--muted);border:1px solid var(--line);padding:4px 7px}

.bar{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--fill,var(--pos));transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar s{position:absolute;top:-4px;bottom:-4px;left:40%;width:2px;background:var(--ink);text-decoration:none}
.bar.lg{height:20px;border-radius:10px}.bar.lg i{border-radius:10px}
.legend{display:flex;justify-content:space-between;font:400 11px var(--f-mono);color:var(--muted);margin-top:4px;position:relative}
.legend .thr{position:absolute;left:40%;transform:translateX(-50%);color:var(--ink);font-weight:500}

.quote{font:500 19px/1.4 var(--f-display);max-width:46ch}
.agent{display:flex;align-items:center;gap:9px}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--f-mono);flex:none}
.av.a{background:var(--a-soft);color:var(--a)} .av.b{background:var(--b-soft);color:var(--b)} .av.h{background:var(--green-soft);color:var(--green)} .av.r{background:var(--off-soft);color:var(--ink)}

.found{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.frow:hover{border-color:var(--muted)}
.frow .t{flex:1;font-weight:600;font-size:14px;min-width:0}
.frow.drop{background:var(--bg);cursor:default}
.frow.drop .t{font-weight:500;color:var(--muted);text-decoration:line-through}

.group{display:flex;flex-direction:column;gap:8px;min-width:0;border-radius:12px;padding:12px;background:var(--bg)}
.group h4{margin:0;font:600 12px var(--f-body)}
.ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.ev:hover{border-color:var(--muted)}
.ev .t{font-weight:600;font-size:13.5px}
.ev .r{font-size:12.5px;color:var(--muted)}

.rec{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.job{border:2px solid var(--b);background:var(--b-soft);border-radius:12px;padding:12px 16px;text-align:center;min-width:160px}
.job b{display:block;font:600 19px var(--f-mono);color:var(--b)}
.job small{font-size:12px;color:var(--muted)}
.why{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.why p{font-size:15px}
.ref{font:500 11.5px var(--f-mono);border:1px solid var(--line);background:var(--surface);padding:2px 6px;border-radius:6px;cursor:pointer;color:var(--ink)}
.ref:hover{border-color:var(--green);color:var(--green)}

.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:9px 14px;border-radius:10px}
.status.ok{background:var(--pos-soft);color:var(--pos)} .status.no{background:var(--bad-soft);color:var(--bad)}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;align-self:flex-start}

.big{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.compare{display:flex;flex-direction:column;gap:14px}
.crow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:14px;align-items:center}
.crow .lbl{font-weight:600;font-size:14px}
.crow .lbl small{display:block;font:400 12px var(--f-mono);color:var(--muted)}
.crow .v{font:700 18px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr) 60px}.crow .bar{grid-column:1/-1;order:3}}

.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.search input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:#FAFBF9}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.toggle{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.toggle button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.strip{position:sticky;bottom:0;margin-top:auto;background:var(--code-bg);color:var(--code-fg);border-radius:12px 12px 0 0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;z-index:5;max-width:980px}
.strip .hd{display:flex;align-items:center;gap:8px;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--code-k)}
.strip .hd .live{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.strip .hd span.r{margin-left:auto;color:var(--code-c);text-transform:none;letter-spacing:0;font-weight:400}
.lines{display:flex;flex-direction:column;gap:1px;max-height:66px;overflow:auto}
.line{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;font:12px/1.6 var(--f-mono);border:0;background:transparent;color:inherit;text-align:left;padding:1px 4px;border-radius:5px;cursor:pointer}
.line:hover{background:rgba(255,255,255,.07)}
.line .tm{color:var(--code-c)} .line .ms{color:var(--code-n)}
.line .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .line .d b{color:var(--code-k);font-weight:500} .line .d b.c{color:var(--code-s)}
.line.fresh{animation:flash 1.2s ease-out}
@keyframes flash{from{background:rgba(127,216,172,.25)}to{background:transparent}}

.insp{background:var(--surface);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:24px 20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (max-width:1180px){.insp{position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.insp h2{margin:6px 0 10px}
.isec{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.isec h4{margin:0;font:500 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
pre.code{background:var(--code-bg);color:var(--code-fg);font:12px/1.55 var(--f-mono);padding:10px 12px;border-radius:10px;overflow-x:auto;margin:0}
.k{color:var(--code-k)}.s{color:var(--code-s)}.n{color:var(--code-n)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px}
.hist .w{font:400 11.5px var(--f-mono);color:var(--muted);padding-top:1px}
.vers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ver{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.ver.cur{border-color:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#134A39"/><circle cx="10" cy="10" r="3.2" fill="#E5A25A"/><circle cx="21" cy="15" r="3.2" fill="#9EA1F5"/><circle cx="10" cy="20" r="3.2" fill="#5FD39A"/><path d="M12.8 11.4 18.3 13.8M12.8 18.6l5.5-2.4" stroke="#9CC0AF" stroke-width="1.5"/></svg>
      <div><b>Precedent</b><small>research memory for agents</small></div>

      <button data-page="research"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="5"/><path d="m13 13 4 4"/></svg>Research</button>

<script>
/* ---------- model ---------- */
const IN = 928, THR = 0.40;
const JOBS = {'plain-l1':{level:1,family:'none',desc:'No dictionary',out:686},'dict-a-l6':{level:6,family:'A',desc:'Dictionary A, stronger setting',out:238},'dict-b-l6':{level:6,family:'B',desc:'Dictionary B, stronger setting',out:760}};
const REQUEST = 'Can we make each cohort A message 40% of its size or less? You get one try.';
const SEED = [
  {key:'promising',id:'7f3a9c12',title:'Dictionary A worked on cohort A',job:'dict-a-l1',family:'A',cohort:'A',out:242,exec:'completed',valid:'valid',dir:'positive',score:.86},
  {key:'failed',id:'b21e07d4',title:'Dictionary B failed on cohort A',job:'dict-b-l1',family:'B',cohort:'A',out:760,exec:'completed',valid:'valid',dir:'negative',score:.83},
  {key:'other',id:'c94f5a61',title:'Dictionary B worked on cohort B',job:'dict-b-l1',family:'B',cohort:'B',out:234,exec:'completed',valid:'valid',dir:'positive',score:.81},
  {key:'crash',id:'e05d8b33',title:'Dictionary C run crashed',job:'dict-c-l1',family:'C',cohort:'A',out:null,exec:'crashed',valid:'invalid',dir:'undetermined',error:'Dictionary C was not installed, so nothing was measured.'},
];
const CORRECTION = {title:'Dictionary A failed on cohort B',cohort:'B',out:760,dir:'negative',score:.79,reason:'The receipt belonged to cohort B, not A'};
const STAGES = ['Agent A discovers','MongoDB remembers','Agent B recommends','Human approves','Agent B executes','Governance','Updated decision'];

let clock = new Date(Date.UTC(2026,10,14,18,38,0));
const tick = s => { clock = new Date(clock.getTime()+s*1000); return clock.toISOString().slice(11,19); };
const now = () => clock.toISOString().slice(11,19);
const S = {page:'demo',stage:1,memory:'on',findings:{},order:[],events:[],search:null,decision:null,receipts:[],sel:null,toast:null,q:'',isolation:false,n:0};
const ratio = f => f.out==null?null:f.out/IN;
const pct = x => Math.round(x*100)+'%';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const refOf = f => `${f.id}·v${f.version}`;
const wait = ms => new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?0:ms));

/* ---------- Atlas activity (what the command listener would capture) ---------- */
function log(op,coll,detail,o={}){
  S.events.push({t:tick(o.dt??.4),op,coll,detail,ms:o.ms??null,docs:o.docs??null,shape:o.shape||null,change:!!o.change,fresh:true});
  renderStrip();
}
const chg = (coll,detail) => log('change stream',coll,detail,{change:true,dt:.1});
function renderStrip(){
  const el=document.getElementById('lines'), ev=S.events.slice(-30), off=S.events.length-ev.length;
  el.innerHTML=ev.map((e,i)=>`<button class="line${e.fresh?' fresh':''}" data-ev="${off+i}"><span class="tm">${e.t}</span><span class="d"><b class="${e.change?'c':''}">${esc(e.op)}</b> ${esc(e.coll)} · ${esc(e.detail)}</span><span class="ms">${e.ms!=null?e.ms+' ms':''}</span></button>`).join('');
  S.events.forEach(e=>e.fresh=false); el.scrollTop=el.scrollHeight;
}

/* ---------- actions ---------- */
async function runAgentA(animate){
  S.findings={};S.order=[];S.search=null;S.decision=null;
  for(const s of SEED){
    if(animate){await wait(500)}
    const f={...s,version:1,status:'current',published:tick(.6),history:[],expires:'2026-11-15 00:00 UTC'};
    f.history.push({v:1,at:f.published,actor:'agent-a',action:'published'});
    S.findings[s.key]=f;S.order.push(s.key);
    log('insert','results',`${f.title}`,{ms:9+(S.order.length*2),docs:1,shape:{insert:'results',documents:[{_id:f.id,project_id:'team-run-01',version:1,job:f.job,conditions:{cohort:f.cohort},execution:f.exec,direction:f.dir}]}});
    if(f.exec==='completed') log('insert','result_vectors',`search vector for ${f.id}`,{ms:7,docs:1,dt:.1});
    chg('results',`new finding shown on screen`);
    if(animate) render();
  }
}
function doSearch(){
  const hits=[],dropped=[];
  for(const k of S.order){const f=S.findings[k];
    if(f.exec!=='completed') continue;
    if(k==='promising'&&f.version===2){dropped.push({f,why:'old version (now corrected)'});hits.push({f,score:CORRECTION.score});continue}
    if(f.status==='expired'){dropped.push({f,why:'expired'});continue}
    hits.push({f,score:f.score});}
  hits.sort((a,b)=>b.score-a.score);
  const cands=hits.map(h=>({...h,applies:h.f.cohort==='A'}));
  const ms=34+Math.round(Math.random()*10);
  log('aggregate','result_vectors',`$vectorSearch in team-run-01 + live-record check · ${cands.length} kept${dropped.length?`, ${dropped.length} dropped`:''}`,{ms,docs:cands.length,shape:PIPE});
  S.search={cands,dropped,ms};
}
function decide(){
  const d={id:'d-'+(++S.n),memory:S.memory,status:'pending',used:[],skipped:[],rejected:[],cands:[],gov:gov()};
  if(S.memory==='off'){d.job='plain-l1';d.reason='Memory is off, so there is nothing to learn from. Play it safe.'}
  else{
    if(!S.search)doSearch(); d.cands=S.search.cands;
    const app=d.cands.filter(c=>c.applies), posA=app.find(c=>c.f.dir==='positive'&&c.f.family==='A'), negB=app.find(c=>c.f.dir==='negative'&&c.f.family==='B');
    d.rejected=d.cands.filter(c=>!c.applies).map(c=>c.f);
    if(posA){d.job='dict-a-l6';d.used=[posA.f,...(negB?[negB.f]:[])];d.reason='Dictionary A already worked on cohort A, so try it at a stronger setting.'+(negB?' Skip dictionary B: it failed here before.':'')}
    else{d.job='plain-l1';d.used=negB?[negB.f]:[];d.reason=(gov().corrected?'Dictionary A turned out to be tested on cohort B, so there is no proof it helps here.':'No evidence that a dictionary helps here.')+(negB?' Dictionary B failed here before.':' Nothing says dictionary B failed anymore, but nothing says it works either.')+' Play it safe.'}
  }
  tick(1.2);
  log('insert','decisions',`recommendation ${d.id}: ${d.job} · waiting for approval`,{ms:8,docs:1,shape:{insert:'decisions',documents:[{_id:d.id,status:'pending',job_id:d.job,used_refs:d.used.map(f=>({result_id:f.id,version:f.version}))}]}});
  S.decision=d;return d;
}
function approve(d){
  const ok=d.status==='pending';
  log('findOneAndUpdate','decisions',`approve ${d.id} only if still pending · ${ok?'matched 1':'matched 0 → refused'}`,{ms:6,docs:ok?1:0,shape:{findAndModify:'decisions',query:{_id:d.id,status:'pending'},update:{$set:{status:'approved',decided_by:'researcher'}}}});
  if(ok){d.status='approved'} else S.toast='Refused: this recommendation was already '+d.status+'. It can only be approved once.';
}
function reject(d){if(d.status!=='pending')return;log('findOneAndUpdate','decisions',`reject ${d.id} · matched 1`,{ms:6,docs:1});d.status='rejected'}
function execute(d){
  if(d.status!=='approved'){S.toast='Nothing runs without approval.';return}
  if(d.used.length) log('find','results',`re-check ${d.used.length} cited finding${d.used.length>1?'s':''} are still current`,{ms:5,docs:d.used.length});
  const j=JOBS[d.job];
  const r={id:'r-'+d.id,d,job:d.job,out:j.out,ratio:j.out/IN,label:labelFor(d),cited:d.used.map(refOf)};
  log('update','decisions',`result saved: ${d.job} → ${j.out}/${IN} bytes`,{ms:7,docs:1});
  chg('decisions','result shown on screen');
  d.status='executed';d.receipt=r;S.receipts=S.receipts.filter(x=>x.label!==r.label);S.receipts.push(r);
}
const gov = () => ({corrected:S.findings.promising?.version===2,expired:S.findings.failed?.status==='expired'});
function labelFor(d){if(d.memory==='off')return 'Memory off';return d.gov.corrected&&d.gov.expired?'After correction + expiry':d.gov.corrected?'After correction':d.gov.expired?'After expiry':'Memory on'}
function correct(reason){
  const f=S.findings.promising; if(f.version!==1) return;
  log('transaction','results',`correct ${f.id}: keep v1 in history, make v2 current`,{ms:21,docs:3,shape:{transaction:[{insert:'result_versions',doc:{result_id:f.id,version:1}},{update:'results',q:{_id:f.id,version:1},u:{$set:{version:2,'conditions.cohort':'B',direction:'negative'}}},{insert:'result_vectors',doc:{result_id:f.id,version:2}}]}});
  chg('results','correction shown on screen');
  f.history.push({v:2,at:now(),actor:'researcher',action:'corrected',reason,prev:{title:f.title,cohort:f.cohort,out:f.out}});
  Object.assign(f,{version:2,title:CORRECTION.title,cohort:'B',out:760,dir:'negative'});S.search=null;
}
function expire(key,reason){
  const f=S.findings[key]; if(f.status!=='current') return;
  f.expiredAt=tick(1);
  log('update','results',`expire ${f.id}: expires_at = now`,{ms:6,docs:1,shape:{update:'results',q:{_id:f.id,project_id:'team-run-01'},u:{$set:{expires_at:'$$NOW'}}}});
  chg('results','expiry shown on screen');
  f.status='expired';f.history.push({v:f.version,at:f.expiredAt,actor:'researcher',action:'expired',reason});S.search=null;
}
const PIPE=[{$vectorSearch:{index:'research_memory_v1',path:'embedding',queryVector:'[1536 floats]',filter:{project_id:'team-run-01'},limit:12}},{$lookup:{from:'results',as:'live',pipeline:[{$match:{same_version:true,expires_at:{$gt:'$$NOW'},execution:'completed'}}]}},{$unwind:'$live'},{$addFields:{applies:'cohort, codec, dictionary, fixture match the task'}}];

/* ---------- small UI pieces ---------- */
function label(f){
  if(f.exec!=='completed') return '<span class="chip c-bad">Crashed, not evidence</span>';
  return (f.dir==='positive'?'<span class="chip c-pos">Worked</span>':'<span class="chip c-neg">Didn’t work</span>')+(f.status==='expired'?' <span class="chip c-bad">Expired</span>':f.version>1?' <span class="chip c-b">Corrected</span>':'');
}
function bar(x,lg){if(x==null)return `<div class="bar${lg?' lg':''}"><s></s></div>`;return `<div class="bar${lg?' lg':''}" role="img" aria-label="${pct(x)} of original size; target 40%"><i style="width:${Math.min(100,x*100)}%;--fill:var(${x<=THR?'--pos':'--neg'})"></i><s></s></div>`}
const legend=()=>`<div class="legend"><span>0%</span><span class="thr">target 40%</span><span>100%</span></div>`;
const ref=f=>`<button class="ref" data-f="${f.key}">${refOf(f)}</button>`;
const mongo=t=>`<div class="mongo"><span class="leaf"><svg viewBox="0 0 16 16"><path d="M8 1c2.6 3 3.6 5.6 3.6 7.7 0 2.6-1.6 4.4-3.6 5.3-2-.9-3.6-2.7-3.6-5.3C4.4 6.6 5.4 4 8 1Z" fill="#5FD39A"/><path d="M8 4v11" stroke="#0D3A2C" stroke-width="1.1"/></svg></span><div><span class="t">In MongoDB</span><p>${t}</p></div></div>`;
function hl(o){return esc(JSON.stringify(o,null,2)).replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="k">$1</span>$2').replace(/:\s(&quot;.*?&quot;)/g,': <span class="s">$1</span>').replace(/:\s(-?\d+\.?\d*|true|false|null)/g,': <span class="n">$1</span>')}

/* ---------- Demo stages ---------- */
function done(){const g=gov(),L=S.receipts.map(r=>r.label);return [S.order.length===4,!!S.search,!!S.decision,!!S.decision&&S.decision.status!=='pending',L.includes('Memory on'),g.corrected&&g.expired,L.length>=4]}
function demoPage(){
  const dn=done();
  return `<div class="stepper">${STAGES.map((s,i)=>`<button data-stage="${i+1}" class="${dn[i]?'done':''}" ${S.stage===i+1?'aria-current="step"':''} aria-label="Stage ${i+1}: ${s}"><span class="dotn">${dn[i]&&S.stage!==i+1?'✓':i+1}</span><span class="lbl">${s}</span></button>`).join('')}</div>
  <div><div class="eyebrow">Stage ${S.stage} of 7</div><h1>${STAGES[S.stage-1]}</h1></div>
  ${[st1,st2,st3,st4,st5,st6,st7][S.stage-1]()}
  ${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}
  <div class="stagebar">${S.stage>1?'<button class="btn ghost" data-act="prev">Back</button>':''}${S.stage<7?'<button class="btn" data-act="next">Next</button>':''}</div>`;
}
const st1=()=>`<p class="lede">Agent A tested four ways to make short messages smaller. It saves every result, including the failure and the crash.</p>
  <div class="fcards">${S.order.map(k=>S.findings[k]).map(f=>`<button class="fcard" data-f="${f.key}"><span class="t">${esc(f.title)}</span><span class="chips">${label(f)}</span>${bar(ratio(f))}<span class="s">${f.out!=null?pct(ratio(f))+' of original size':'No measurement'}</span></button>`).join('')}</div>
  <div class="row"><button class="link" data-act="runA">Replay Agent A</button></div>
  ${mongo('Each result is saved as one document and appears here instantly through a <b>change stream</b>. The crash is saved too, but never offered to agents as evidence.')}`;
function st2(){
  const s=S.search;
  if(S.memory==='off') return `<p class="lede">Memory is turned off in Settings, so Agent B starts with nothing.</p>`;
  return `<p class="lede">A brand-new Agent B gets the same goal in its own words. It has never seen Agent A’s notes.</p>
  <div class="card"><div class="agent" style="margin-bottom:10px"><span class="av b">B</span><b>Agent B asks</b></div><p class="quote">“${REQUEST}”</p></div>
  ${s?`<div class="found">${s.cands.map(c=>`<button class="frow" data-f="${c.f.key}"><span class="t">${esc(c.f.title)}</span>${label(c.f)}</button>`).join('')}
    ${s.dropped.map(c=>`<div class="frow drop"><span class="t">${esc(c.f.title)}</span><span class="chip c-bad">Dropped: ${c.why}</span></div>`).join('')}</div>`:'<p class="muted">Searching…</p>'}
  ${mongo(`<b>Atlas Vector Search</b> found Agent A’s work by meaning, inside this project only, in ${s?s.ms:'~40'} ms. The same query checked every result is still current${s&&s.dropped.length?' and dropped the ones that aren’t':''}.`)}`;
}
function st3(){
  const d=S.decision; if(!d) return '<p class="muted">Thinking…</p>';
  const col=(t,c,list,why)=>`<div class="group"><h4 style="color:${c}">${t}</h4>${list.map(x=>`<button class="ev" data-f="${x.f.key}"><span class="t">${esc(x.f.title)}</span><span class="r">${why(x)}</span></button>`).join('')||'<span class="muted" style="font-size:13px">None</span>'}</div>`;
  return `<p class="lede">MongoDB marks which results apply to this task. Agent B uses them to pick one job.</p>
  ${d.memory==='on'?`<div class="grid3">
    ${col('Applies and worked','var(--pos)',d.cands.filter(c=>c.applies&&c.f.dir==='positive'),c=>pct(ratio(c.f))+' of original size')}
    ${col('Applies and failed','var(--neg)',d.cands.filter(c=>c.applies&&c.f.dir==='negative'),()=>'Missed the 40% target')}
    ${col('Doesn’t apply','var(--bad)',d.cands.filter(c=>!c.applies),c=>'Tested on cohort '+c.f.cohort+', not A')}</div>`:''}
  <div class="card"><div class="rec"><div class="job"><b>${d.job}</b><small>${JOBS[d.job].desc}</small></div>
    <div class="why"><p>${esc(d.reason)}</p><p class="muted" style="font-size:13px">Based on: ${d.used.map(ref).join(' ')||'no evidence'}</p></div></div></div>
  ${mongo(d.memory==='on'?'The match against the task’s conditions happened <b>inside the same search query</b>, so the cohort B result arrived already marked “doesn’t apply”.':'No search ran. The recommendation is saved and waits for approval.')}`;
}
function st4(){
  const d=S.decision; if(!d) return '<p class="muted">Go back to stage 3 first.</p>';
  return `<p class="lede">A person checks the recommendation. Nothing runs until they approve it.</p>
  <div class="card"><div class="rec"><div class="job"><b>${d.job}</b><small>${JOBS[d.job].desc}</small></div><div class="why"><p>${esc(d.reason)}</p></div></div>
    <div class="row" style="margin-top:16px">${d.status==='pending'?'<button class="btn" data-act="approve">Approve</button><button class="btn danger" data-act="reject">Reject</button>'
      :d.status==='rejected'?'<span class="status no">Rejected. Nothing ran.</span><button class="btn ghost" data-act="again">Ask Agent B again</button>'
      :'<span class="status ok">Approved</span><button class="link" data-act="approveAgain">Try approving twice</button>'}</div></div>
  ${mongo(d.status==='pending'?'Approving is a single <b>atomic update</b> that only works while the recommendation is still waiting.':d.status==='rejected'?'Rejected and saved. The runner only runs approved recommendations, so nothing happened.':'Approved exactly once. A second approval finds nothing waiting and is refused.')}`;
}
function st5(){
  const d=S.decision, r=d&&d.receipt, base=S.receipts.find(x=>x.label==='Memory off');
  if(!d||d.status==='pending'||d.status==='rejected') return `<p class="lede">${d&&d.status==='rejected'?'The recommendation was rejected, so nothing runs.':'Waiting for approval at stage 4.'}</p>`;
  if(!r) return `<p class="lede">The approved job runs on 8 messages Agent A never saw.</p><div class="row"><button class="btn" data-act="execute">Run the approved job</button></div>
    ${mongo('Just before running, the cited results are re-read to make sure nobody corrected or expired them in the meantime.')}`;
  return `<p class="lede">The approved job ran on 8 messages Agent A never saw.</p>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:14px"><div><div class="big" style="color:var(${r.ratio<=THR?'--pos':'--neg'})">${pct(r.ratio)}</div><p class="muted">of original size with ${r.job}</p></div>
    ${base?`<div style="text-align:right"><div class="big">${(base.out/r.out).toFixed(1)}×</div><p class="muted">smaller than without memory</p></div>`:''}</div>
    <div class="compare"><div class="crow"><span class="lbl">With memory<small>${r.job}</small></span>${bar(r.ratio,true)}<span class="v">${pct(r.ratio)}</span></div>
    ${base?`<div class="crow"><span class="lbl">Without memory<small>${base.job}</small></span>${bar(base.ratio,true)}<span class="v">${pct(base.ratio)}</span></div>`:''}</div>${legend()}</div>
  ${mongo('The cited results were re-checked right before running, and the result was saved and streamed to this screen.')}`;
}
function st6(){
  const p=S.findings.promising,f=S.findings.failed,g=gov(),d=S.decision;
  const pending=d&&d.status==='pending'&&(d.gov.corrected||d.gov.expired);
  const last=S.receipts.filter(r=>r.label.startsWith('After')).slice(-1)[0];
  return `<p class="lede">A person fixes one result and retires another. After each, Agent B asks the same question again.</p>
  <div class="grid2">
    <div class="card"><div class="eyebrow">1 · Correct</div><h2 style="margin:6px 0">${esc(g.corrected?CORRECTION.title:p.title)}</h2>
      <p class="muted" style="font-size:14px">It was really tested on cohort B.</p>
      <div style="margin-top:12px">${g.corrected?'<span class="chip c-b">Corrected</span> <button class="link" data-f="promising">See old and new</button>':'<button class="btn" data-act="correct">Correct it</button>'}</div></div>
    <div class="card"><div class="eyebrow">2 · Expire</div><h2 style="margin:6px 0">${esc(f.title)}</h2>
      <p class="muted" style="font-size:14px">This old result shouldn’t guide agents anymore.</p>
      <div style="margin-top:12px">${g.expired?'<span class="chip c-bad">Expired</span> <button class="link" data-f="failed">See history</button>':`<button class="btn danger" data-act="expire" ${g.corrected?'':'disabled title="Correct first, so each change shows on its own"'}>Expire it</button>`}</div></div>
  </div>
  <div class="card"><div class="row"><div class="agent"><span class="av b">B</span><b>Agent B asks again</b></div><span style="flex:1"></span>
    <button class="btn" data-act="rerun" ${(g.corrected||g.expired)&&!pending&&!(last&&last.d.gov.corrected===g.corrected&&last.d.gov.expired===g.expired)?'':'disabled'}>Re-run</button></div>
    ${pending?`<div class="rec" style="margin-top:14px"><div class="job"><b>${d.job}</b><small>${JOBS[d.job].desc}</small></div><div class="why"><p>${esc(d.reason)}</p>
      <div class="row"><button class="btn" data-act="approveRun">Approve and run</button><button class="btn danger" data-act="reject">Reject</button></div></div></div>`
    :last?`<p style="margin-top:12px"><span class="chip c-g">${last.label}: ran ${last.job}, ${pct(last.ratio)}</span></p>`:''}
  </div>
  ${mongo(g.expired?'Expiry took effect on the very next search. Atlas will delete the record later with a <b>TTL index</b>, but nothing waits for that.':g.corrected?'The correction was one <b>transaction</b>: the old version is kept for people to read, and only the new one can be used by agents.':'Corrections and expiry change what every agent can use, starting with the next search.')}`;
}
function st7(){
  const L=['Memory off','Memory on','After correction','After correction + expiry'], by=l=>S.receipts.find(r=>r.label===l);
  return `<p class="lede">Same question, same choices, one try each. Only the memory changed.</p>
  <div class="card"><div class="compare">${L.map(l=>{const r=by(l);return `<div class="crow"><span class="lbl">${l}<small>${r?r.job:'not run yet'}</small></span>${r?bar(r.ratio,true):'<div class="bar lg"><s></s></div>'}<span class="v" style="color:var(${r?(r.ratio<=THR?'--pos':'--neg'):'--muted'})">${r?pct(r.ratio):'—'}</span></div>`}).join('')}</div>${legend()}</div>
  ${mongo('Every run records the exact result versions it read from Atlas, so you can trace each decision back to its evidence.')}`;
}

/* ---------- other pages ---------- */

function settingsPage(){
  return `<div><div class="eyebrow">Settings</div><h1>Environment</h1></div>
  <div class="grid2">
    <div class="card"><h2 style="margin-bottom:10px">MongoDB Atlas</h2><dl class="kv"><dt>status</dt><dd style="color:var(--pos)">connected</dd><dt>database</dt><dd>research_memory</dd><dt>vector index</dt><dd>research_memory_v1 · ready</dd><dt>change streams</dt><dd>on</dd><dt>cleanup</dt><dd>TTL index on purge_at</dd></dl></div>
    <div class="card"><h2 style="margin-bottom:10px">Agent B memory</h2><div class="toggle" role="group" aria-label="Agent B memory"><button data-mem="on" aria-pressed="${S.memory==='on'}">On</button><button data-mem="off" aria-pressed="${S.memory==='off'}">Off</button></div>
      <p class="muted" style="font-size:13px;margin-top:10px">Off records the baseline: Agent B skips search and plays it safe.</p></div>
    <div class="card"><h2 style="margin-bottom:10px">Project</h2><dl class="kv"><dt>project</dt><dd>team-run-01</dd><dt>agents</dt><dd>agent-a, agent-b</dd><dt>human</dt><dd>researcher</dd></dl></div>
    <div class="card"><h2 style="margin-bottom:10px">Isolation check</h2><p class="muted" style="font-size:13px;margin-bottom:10px">Ask the same question from another team’s project.</p>
      <button class="btn ghost" data-act="iso">Run check</button>${S.isolation?'<p style="margin-top:10px"><span class="chip c-g">Found 0 results</span> <span class="chip c-g">Direct read refused (404)</span></p>':''}</div>
  </div>`;
}

/* ---------- inspector ---------- */
function inspector(){
  const el=document.getElementById('insp'), sel=S.sel;
  if(sel&&sel.f){const f=S.findings[sel.f], x=ratio(f), prev=f.history.find(h=>h.prev);
    el.innerHTML=`<div class="eyebrow">Finding · ${refOf(f)}</div><h2>${esc(f.title)}</h2><div class="chips">${label(f)}</div>
    <div class="isec" style="margin-top:14px"><h4>Tested on</h4><dl class="kv"><dt>cohort</dt><dd>${f.cohort}</dd><dt>job</dt><dd>${f.job}</dd><dt>messages</dt><dd>8 · ${IN} bytes</dd></dl></div>
    <div class="isec"><h4>Result</h4>${x==null?`<p style="font-size:13.5px">${esc(f.error)} A crash doesn’t show whether the idea works, so agents never use it.</p>`:`${bar(x,true)}${legend()}<p class="num" style="font-size:13px">${f.out} / ${IN} bytes</p>`}</div>
    ${prev?`<div class="isec"><h4>Versions</h4><div class="vers"><div class="ver"><b>v1 · old</b><span>${esc(prev.prev.title)}</span></div><div class="ver cur"><b>v2 · current</b><span>${esc(f.title)}</span></div></div><p class="muted" style="font-size:12px">People can read v1. Agents can only use v2.</p></div>`:''}
    <div class="isec"><h4>History</h4><ul class="hist">${f.history.map(h=>`<li><span class="w">${h.at}</span><span>${h.action} by ${h.actor}${h.reason?` · “${esc(h.reason)}”`:''}</span></li>`).join('')}</ul></div>
    <div class="isec"><h4>Rerun it</h4><pre class="code">python -m benchmark.run --job ${f.job} --cohort ${f.cohort}</pre></div>`;return}
  if(sel&&sel.ev!=null){const e=S.events[sel.ev];
    el.innerHTML=`<div class="eyebrow">Atlas · ${e.t}</div><h2>${esc(e.op)} · ${esc(e.coll)}</h2><p style="font-size:13.5px">${esc(e.detail)}</p>
    <div class="isec" style="margin-top:12px"><dl class="kv"><dt>time</dt><dd>${e.ms!=null?e.ms+' ms':'—'}</dd><dt>documents</dt><dd>${e.docs??'—'}</dd></dl></div>
    ${e.shape?`<div class="isec"><h4>What ran (simplified)</h4><pre class="code">${hl(e.shape)}</pre></div>`:''}`;return}
  const d=S.decision;
  if(S.page==='demo'&&d&&S.stage>=3&&S.stage<=6){
    el.innerHTML=`<div class="eyebrow">Recommendation ${d.id}</div><h2>${d.job}</h2><div class="chips"><span class="chip ${d.status==='rejected'?'c-bad':d.status==='pending'?'c-b':'c-pos'}">${d.status}</span></div>
    <div class="isec" style="margin-top:14px"><h4>Why</h4><p style="font-size:14px">${esc(d.reason)}</p></div>
    <div class="isec"><h4>Evidence used</h4>${d.used.length?d.used.map(f=>`<div>${ref(f)} <span style="font-size:13px">${esc(f.title)}</span></div>`).join(''):'<span class="muted">None</span>'}</div>
    ${d.rejected.length?`<div class="isec"><h4>Set aside</h4>${d.rejected.map(f=>`<div>${ref(f)} <span style="font-size:13px">${esc(f.title)}</span></div>`).join('')}</div>`:''}`;return}
  el.innerHTML=`<div class="eyebrow">Details</div><h2>The task</h2><p style="font-size:14.5px">${REQUEST}</p>
  <div class="isec" style="margin-top:14px"><h4>Same every run</h4><dl class="kv"><dt>messages</dt><dd>8, never seen by Agent A</dd><dt>target</dt><dd>40% of original size or less</dd><dt>choices</dt><dd>no dictionary, dictionary A, dictionary B</dd><dt>tries</dt><dd>1</dd></dl></div>
  <p class="muted" style="font-size:13px;margin-top:8px">Click any result or any line in the Atlas activity strip to see it here.</p>`;
}

/* ---------- render & events ---------- */
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===S.page?'page':'false'));
  document.getElementById('page').innerHTML={demo:demoPage,research:researchPage,governance:govPage,settings:settingsPage}[S.page]();
  const rs=document.getElementById('rs'); if(rs) rs.addEventListener('submit',e=>{e.preventDefault();S.q=document.getElementById('rq').value;render()});
  inspector(); S.toast=null;
}
async function go(n){
  S.stage=n;S.sel=null;render();
  if(n===2&&S.memory==='on'&&!S.search&&!S.decision){await wait(350);doSearch();render()}
  if(n===3&&!S.decision){await wait(250);decide();render()}
}
const showInsp=()=>{if(innerWidth<1180)document.getElementById('insp').scrollIntoView({behavior:'smooth'})};
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){S.page=b.dataset.page;S.sel=null;render()}});
document.getElementById('lines').addEventListener('click',e=>{const b=e.target.closest('[data-ev]');if(b){S.sel={ev:+b.dataset.ev};inspector();showInsp()}});
document.addEventListener('click',async e=>{
  const st=e.target.closest('[data-stage]'); if(st) return go(+st.dataset.stage);
  const m=e.target.closest('[data-mem]'); if(m){S.memory=m.dataset.mem;S.search=null;S.decision=null;render();return}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act,d=S.decision;
    if(act==='next') return go(Math.min(7,S.stage+1));
    if(act==='prev') return go(Math.max(1,S.stage-1));
    if(act==='runA'){await runAgentA(true);render();return}
    if(act==='approve'||act==='approveAgain'){approve(d);render();return}
    if(act==='reject'){reject(d);render();return}
    if(act==='again'){if(S.memory==='on')doSearch();decide();render();return}
    if(act==='execute'){execute(d);render();return}
    if(act==='correct'){correct(CORRECTION.reason);render();return}
    if(act==='expire'){expire('failed','Superseded by newer measurements');render();return}
    if(act==='expireAny'){expire(a.dataset.k,'No longer relevant');render();return}
    if(act==='rerun'){if(S.memory==='on')doSearch();decide();render();return}
    if(act==='approveRun'){approve(d);execute(d);render();return}
    if(act==='iso'){log('aggregate','result_vectors','same search from project northwind-lab · 0 results',{ms:31,docs:0});log('find','results','direct read from northwind-lab · not found',{ms:3,docs:0});S.isolation=true;render();return}
  }
  const f=e.target.closest('[data-f]'); if(f){S.sel={f:f.dataset.f};inspector();showInsp();return}
});

/* boot: Agent A has published; a memory-off baseline exists from rehearsal */
(async()=>{
  await runAgentA(false);
  S.memory='off'; const d0=decide(); approve(d0); execute(d0); S.memory='on'; S.decision=null; S.search=null;
  render();
})();
</script>
